name: Decode binary assets
on:
  push:
    branches: [main]
    paths: ['assets/*.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode .b64 files into binaries
        run: |
          shopt -s nullglob
          for f in assets/*.b64; do
            base64 -d "$f" > "${f%.b64}"
            git rm -q --cached "$f" || true
            rm "$f"
            sha256sum "${f%.b64}"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          git diff --cached --quiet || git commit -m "Decode binary assets"
          git push
